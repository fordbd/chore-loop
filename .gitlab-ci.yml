stages:
  - test
  - publish

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

backend-tests:
  stage: test
  image: python:3.13-slim
  script:
    - python -m unittest discover -s tests -v

browser-storage-tests:
  stage: test
  image: node:24-alpine
  script:
    - node tests/test_storage.cjs
    - node -e 'const fs=require("fs"),vm=require("vm"); const html=fs.readFileSync("dist/index.html","utf8"); new vm.Script(html.split("<script>")[1].split("</script>")[0]);'

publish-image:
  stage: publish
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
  before_script:
    - |
      test -n "$CI_REGISTRY" && test -n "$CI_REGISTRY_IMAGE"
      mkdir -p "$HOME/.docker"
      registry_auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$registry_auth" > "$HOME/.docker/config.json"
      chmod 600 "$HOME/.docker/config.json"
  script:
    - |
      image_tag="${CI_COMMIT_TAG:-$CI_COMMIT_SHA}"
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output "type=image,name=${CI_REGISTRY_IMAGE}:${image_tag},push=true"
      printf 'Published image: %s:%s\n' "$CI_REGISTRY_IMAGE" "$image_tag"
  after_script:
    - rm -f "$HOME/.docker/config.json"
