services:
  planner:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      APP_USER: ${APP_USER:-family}
      APP_PASSWORD: ${APP_PASSWORD:-}
      DB_PATH: /data/chores.sqlite3
      TZ: ${TZ:-America/New_York}
    volumes:
      - planner_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  planner_data:
